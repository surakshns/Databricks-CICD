bundle:
  name: databricks-workspace

targets:
  dv:
    mode: development
    workspace:
      host: https://dbc-bc909f8e-ee32.cloud.databricks.com
      root_path: ~/.bundle/${bundle.name}/${bundle.target}   # personal dev path

  staging:
    workspace:
      host: https://dbc-bc909f8e-ee32.cloud.databricks.com
      root_path: /Shared/staging/${bundle.name}              # shared staging path

  prod:
    mode: production
    workspace:
      host: https://dbc-bc909f8e-ee32.cloud.databricks.com
      root_path: /Shared/prod/${bundle.name}                 # shared prod path
