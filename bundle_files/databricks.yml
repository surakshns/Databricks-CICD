bundle:
  name: databricks-workspace

targets:
  dv:
    mode: development
    workspace:
      file_path: /Workspace/Shared/
      host: https://dbc-bc909f8e-ee32.cloud.databricks.com
      root_path: /dv/${bundle.name}   # personal dev path

  staging:
    workspace:
      file_path: /Workspace/Shared/
      host: https://dbc-bc909f8e-ee32.cloud.databricks.com
      root_path: /staging/${bundle.name}              # shared staging path

  prod:
    mode: production
    workspace:
      file_path: /Workspace/Shared/
      host: https://dbc-bc909f8e-ee32.cloud.databricks.com
      root_path: /prod/${bundle.name}                 # shared prod path
