name: Databricks Bundle Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Bundle
        uses: databricks/run-notebook@v0        # 👈 official Databricks action
        with:
          databricks-host: https://dbc-bc909f8e-ee32.cloud.databricks.com
          databricks-token: ${{ secrets.DATABRICKS_TOKEN }}
          run-command: |
            databricks bundle validate -t dv

      - name: Deploy Bundle
        uses: databricks/run-notebook@v0
        with:
          databricks-host: https://dbc-bc909f8e-ee32.cloud.databricks.com
          databricks-token: ${{ secrets.DATABRICKS_TOKEN }}
          run-command: |
            databricks bundle deploy -t dv
