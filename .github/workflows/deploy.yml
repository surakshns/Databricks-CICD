name: Databricks Bundle Deploy

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate
        uses: databricks/bundle-cicd@v0
        with:
          command: validate
          target: dv
          databricks-host: https://dbc-bc909f8e-ee32.cloud.databricks.com
          databricks-token: ${{ secrets.DATABRICKS_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs: validate                             # 👈 deploy only if validate passes
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy
        uses: databricks/bundle-cicd@v0
        with:
          command: deploy
          target: dv
          databricks-host: https://dbc-bc909f8e-ee32.cloud.databricks.com
          databricks-token: ${{ secrets.DATABRICKS_TOKEN }}
